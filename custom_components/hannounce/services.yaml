announce:
  target:
    entity:
      domain: media_player
  fields:
    message:
      example: Dinner is ready!
      selector:
        text:
    file:
      example: /media/messages/dinner.mp3
      selector:
        text:
    url:
      example: https://example.com/message.mp3
      selector:
        text:
          type: url
    tts_entity:
      selector:
        entity:
          domain: tts
    language:
      example: en
      selector:
        text:
    volume:
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    chime:
      selector:
        select:
          translation_key: chime
          options:
            - none
            - ding_dong
            - soft
            - three_tone
            - custom
    force:
      default: false
      selector:
        boolean:
replay:
  target:
    entity:
      domain: media_player
  fields:
    volume:
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    force:
      default: false
      selector:
        boolean:
